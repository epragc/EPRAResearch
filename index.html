<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPRA Research</title>
<meta name="description" content="Discover our new projects. Documents and links from EPRA Research.">
<meta name="theme-color" content="#12497F">
<link rel="icon" href="assets/epra-logo.png">

<!-- Open Graph: makes the link look right when shared in chat/email -->
<meta property="og:title" content="EPRA Research">
<meta property="og:description" content="Discover our new projects!">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@200;300;400&display=swap" rel="stylesheet">

<style>
/* ===== EPRA brand tokens ================================================= */
:root{
  --epra-primary:#12497F;
  --epra-light-blue:#69AAF3;
  --epra-grey:#C6C5C2;
  --epra-gold:#EBA61C;

  /* Overpass Light (300) is the house weight for this page. */
  --font:"Overpass","Franklin Gothic Book","Franklin Gothic",Arial,sans-serif;

  --ink:#FFFFFF;
  --ink-soft:rgba(255,255,255,.76);
  --ink-faint:rgba(255,255,255,.55);

  /* Vertical rhythm scales with the viewport so the three boxes
     stay on one screen from a small phone up to a laptop.          */
  --gap:clamp(10px,1.6vh,18px);
  --pad-y:clamp(14px,2.1vh,22px);
  --pad-x:clamp(18px,3.4vw,28px);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--epra-primary);
  color:var(--ink);
  font-family:var(--font);
  font-weight:300;                 /* Light */
  font-size:16px;
  line-height:1.5;
  text-align:center;               /* centred page */
  -webkit-font-smoothing:antialiased;

  min-height:100vh;
  min-height:100dvh;               /* real phone viewport, minus browser chrome */
  display:flex;flex-direction:column;
}

/* auto margins centre the block when there is room, and collapse to 0
   when there is not, so nothing is ever clipped off the top */
.page{
  width:100%;max-width:680px;
  margin:auto;
  padding:clamp(18px,3vh,34px) 20px;
}

/* ===== Masthead: the EPRA mark, then the title ========================== */
.hero{margin-bottom:clamp(16px,2.6vh,28px)}
.hero h1{
  margin:0 0 6px;
  display:flex;align-items:center;justify-content:center;
  gap:.30em;
  font-weight:300;
  font-size:clamp(30px,7.6vw,46px);
  line-height:1.05;
  color:var(--ink);
}
/* The mark keeps its official proportion to the wordmark: in the EPRA
   lockup it stands 1.943x the cap height of "EPRA". Overpass has a cap
   height of .711em (measured), so that ratio sizes it against this title.
   The nudge centres the mark on the CAP height of the text rather than on
   the line box, which sits .102em lower. Both values are pure ratios, so
   the lockup holds at every font size.                                  */
.hero h1 img{
  height:calc(1em * .711 * 1.943);
  width:auto;display:block;
  transform:translateY(-.102em);
}
.hero p{
  margin:0 auto;color:var(--ink-soft);
  font-size:clamp(15px,4vw,19px);max-width:40ch;
}

/* ===== Section boxes ===================================================== */
/* One shared format. The only difference between them is the colour of
   the left border.                                                      */
main{display:flex;flex-direction:column;gap:var(--gap)}
.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-left:5px solid var(--accent);
  border-radius:10px;
  padding:var(--pad-y) var(--pad-x);
  text-align:center;
}
.card[data-accent="blue"]{--accent:var(--epra-light-blue)}
.card[data-accent="grey"]{--accent:var(--epra-grey)}
.card[data-accent="gold"]{--accent:var(--epra-gold)}

.card h2{
  margin:0 0 4px;
  font-weight:300;
  font-size:clamp(18px,4.8vw,22px);line-height:1.28;
  color:var(--ink);
}
.card .desc{
  margin:0 auto;color:var(--ink-soft);
  font-size:clamp(13.5px,3.5vw,15px);max-width:46ch;
}

/* ===== Item list ========================================================= */
ul.items{
  list-style:none;margin:var(--pad-y) 0 0;padding:var(--pad-y) 0 0;
  border-top:1px dashed rgba(255,255,255,.20);
  display:flex;flex-direction:column;gap:8px;
}
/* Reads as a button: raised surface, real border, trailing action arrow.
   Phones have no hover, so the affordance has to be visible at rest.   */
a.item{
  display:block;padding:11px 16px;border-radius:10px;
  border:1px solid rgba(255,255,255,.34);
  background:rgba(255,255,255,.11);
  text-decoration:none;color:inherit;
  transition:background .15s,border-color .15s,transform .1s;
}
a.item:hover,a.item:focus-visible{
  background:rgba(255,255,255,.20);
  border-color:rgba(255,255,255,.62);
  outline:none;
}
a.item:active{transform:translateY(1px)}
a.item:focus-visible{box-shadow:0 0 0 2px var(--accent)}

.item-head{display:flex;align-items:center;justify-content:center;gap:9px}
.item-head .ficon{width:16px;height:16px;flex:0 0 16px;color:var(--accent)}
.item-head .action{width:15px;height:15px;flex:0 0 15px;color:var(--ink-soft)}
.item-title{font-weight:400;font-size:15.5px;line-height:1.3}
.item-desc{font-size:13px;color:var(--ink-soft);margin:2px auto 0;max-width:40ch}
.item-meta{
  font-size:10.5px;color:var(--ink-faint);
  letter-spacing:.08em;text-transform:uppercase;margin-top:3px;
}

/* ===== Empty state: one compact line, not a big box ====================== */
.empty{
  margin:var(--pad-y) 0 0;padding:var(--pad-y) 0 0;
  border-top:1px dashed rgba(255,255,255,.20);
  color:var(--ink-faint);font-size:12.5px;line-height:1.45;
}
.empty code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;background:rgba(255,255,255,.12);
  padding:1px 5px;border-radius:4px;color:var(--ink-soft);
}

/* ===== Footer ============================================================ */
footer{
  margin-top:clamp(14px,2.4vh,24px);
  color:var(--ink-faint);font-size:12px;
  display:flex;flex-wrap:wrap;gap:4px 14px;
  align-items:center;justify-content:center;
}
footer a{color:var(--epra-grey);text-decoration:none}
footer a:hover{text-decoration:underline}

/* ===== Short viewports (small phones, laptop browser chrome) ============= */
@media (max-height:720px){
  :root{--gap:8px;--pad-y:11px}
  .page{padding:14px 18px}
  .hero{margin-bottom:12px}
  .hero h1{font-size:clamp(25px,6.6vw,32px)}
  .hero p{font-size:14px}
  .card h2{font-size:clamp(16px,4.4vw,19px)}
  .card .desc{font-size:12.5px}
  .empty{font-size:11.5px;margin-top:9px;padding-top:9px}
  ul.items{gap:6px}
  a.item{padding:9px 14px}
  footer{margin-top:11px;font-size:11px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <h1>
      <img src="assets/epra-icon-white.png" alt="">
      <span id="eventTitle"></span>
    </h1>
    <p id="tagline"></p>
  </header>

  <main id="sections"></main>

  <footer id="foot"></footer>

</div>

<script src="content.js"></script>
<script>
(function () {
  var D = window.EPRA_HUB;
  if (!D) {
    document.body.innerHTML =
      '<p style="padding:40px;font-family:Arial;color:#fff">content.js failed to load.</p>';
    return;
  }

  /* --- tiny helpers ----------------------------------------------------- */
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;   // textContent = no HTML injection
    return n;
  }
  function svg(paths, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" ' +
           'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" ' +
           'stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }

  var ICONS = {
    pdf:   '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    pptx:  '<rect x="3" y="4" width="18" height="12" rx="1"/><line x1="12" y1="16" x2="12" y2="20"/><line x1="8" y1="20" x2="16" y2="20"/>',
    xlsx:  '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/>',
    video: '<polygon points="10 8 16 12 10 16 10 8"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
    data:  '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
    link:  '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
  };

  /* trailing arrow: down = downloads a file, diagonal = opens a site */
  var ACTION = {
    download: '<path d="M12 4v11"/><polyline points="7 11 12 16 17 11"/><path d="M5 20h14"/>',
    external: '<path d="M7 17 17 7"/><polyline points="8 7 17 7 17 16"/>'
  };

  /* --- header ------------------------------------------------------------ */
  var ev = D.event || {};
  document.getElementById('eventTitle').textContent = ev.title || 'EPRA Research';
  document.getElementById('tagline').textContent = ev.tagline || '';
  document.title = ev.title || 'EPRA Research';

  /* --- sections ---------------------------------------------------------- */
  var host = document.getElementById('sections');

  (D.sections || []).forEach(function (s) {
    var card = el('section', 'card');
    card.id = s.id;
    card.setAttribute('data-accent', s.accent || 'blue');

    card.appendChild(el('h2', null, s.title));
    if (s.description) card.appendChild(el('p', 'desc', s.description));

    var items = s.items || [];

    if (items.length === 0) {
      /* --- empty state: one line, says exactly where to add content --- */
      var e = el('div', 'empty');
      e.appendChild(document.createTextNode('content.js '));
      e.appendChild(el('code', null, '"' + s.id + '"'));
      card.appendChild(e);
    } else {
      var ul = el('ul', 'items');
      items.forEach(function (it) {
        var li = el('li');
        var a = el('a', 'item');
        a.href = it.href || '#';

        var external = /^https?:/i.test(it.href || '');
        if (external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

        var type = it.type || (external ? 'link' : 'pdf');

        var hd = el('div', 'item-head');
        hd.innerHTML = svg(ICONS[type] || ICONS.link, 'ficon');
        hd.appendChild(el('span', 'item-title', it.title || 'Untitled'));
        var act = el('span');
        act.innerHTML = svg(external ? ACTION.external : ACTION.download, 'action');
        hd.appendChild(act.firstChild);
        a.appendChild(hd);

        if (it.description) a.appendChild(el('div', 'item-desc', it.description));
        if (it.meta) a.appendChild(el('div', 'item-meta', it.meta));

        li.appendChild(a);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    host.appendChild(card);
  });

  /* --- footer ------------------------------------------------------------ */
  var ft = D.footer || {}, fm = document.getElementById('foot');
  if (ft.contact) {
    var a1 = el('a'); a1.href = 'mailto:' + ft.contact; a1.textContent = ft.contact; fm.appendChild(a1);
  }
})();
</script>
</body>
</html>
